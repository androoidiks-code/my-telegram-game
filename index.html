<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Bird: Lucky Spin 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-yellow: #fcd34d; --bg-sky: #0ea5e9; --accent-blue: #3b82f6; --danger: #f43f5e; }
        body { font-family: 'Segoe UI', sans-serif; background: #020617; color: white; text-align: center; margin: 0; padding: 10px; overflow: hidden; touch-action: manipulation; user-select: none; }
        
        /* Прогресс вывода */
        .withdraw-panel { background: var(--accent-blue); border-radius: 15px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .progress-container { background: rgba(0,0,0,0.3); height: 10px; border-radius: 10px; margin-top: 8px; overflow: hidden; }
        #progressBar { background: linear-gradient(90deg, #f59e0b, #fcd34d); width: 0%; height: 100%; transition: 0.5s; }

        /* Кошелек */
        .wallet-card { background: #1e293b; border-radius: 20px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-around; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .balance-value { font-size: 24px; color: var(--main-yellow); font-weight: bold; }

        /* Игровая сцена */
        #game-scene { 
            position: relative; width: 100%; height: 260px; 
            background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 100%); 
            border-radius: 24px; overflow: hidden; margin-bottom: 10px; border: 3px solid #1e293b;
        }
        #bird-container { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); z-index: 100; transition: top 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        #bird { font-size: 55px; transform: scaleX(-1); display: inline-block; }
        
        /* Визуальные элементы */
        .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.5; animation: moveCloud linear infinite; }
        @keyframes moveCloud { from { right: -100px; } to { right: 110%; } }
        
        .floating-star { position: absolute; font-size: 20px; z-index: 50; animation: starMove 1.5s linear forwards; }
        @keyframes starMove { from { right: -50px; } to { right: 110%; } }

        #multiplier-tag { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 14px; color: var(--main-yellow); display: none; }

        /* Кнопки */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 12px 5px; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; color: white; font-size: 11px; transition: 0.2s; border-bottom: 4px solid rgba(0,0,0,0.3); }
        .btn:active { transform: translateY(2px); border-bottom: 0; }
        
        .btn-free { background: #8b5cf6; grid-column: span 2; font-size: 13px; }
        .btn-std { background: #10b981; }
        .btn-super { background: #f59e0b; }
        .btn-turbo { background: #3b82f6; }
        .btn-energy { background: var(--danger); grid-column: span 2; font-size: 14px; margin-top: 5px; }
        .btn-soon { background: #334155; color: #94a3b8; font-size: 10px; }
        
        .btn-take { background: var(--main-yellow); color: #000; grid-column: span 2; display: none; font-size: 22px; font-weight: 900; padding: 15px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .history-list { font-size: 10px; color: #94a3b8; margin-top: 10px; text-align: left; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; height: 50px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="withdraw-panel">
        <div style="display: flex; justify-content: space-around; font-size: 11px; font-weight: bold;">
            <span>ПРОГРЕСС ВЫВОДА: <span id="with-val">0</span>%</span>
            <span>ДРУЗЬЯ: <span id="ref-val">0</span>/5</span>
        </div>
        <div class="progress-container"><div id="progressBar"></div></div>
        <button onclick="checkWithdraw()" style="margin-top: 5px; background: none; border: 1px solid white; color: white; border-radius: 5px; font-size: 9px; padding: 2px 10px;">ВЫВЕСТИ ⭐</button>
    </div>

    <div class="wallet-card">
        <div><small style="color: #94a3b8;">БАЛАНС</small><div class="balance-value"><span id="balanceDisplay">0</span> ⭐</div></div>
        <div><small style="color: #94a3b8;">В ПОЛЕТЕ</small><div class="balance-value" style="color:white"><span id="currentWin">0</span> ⭐</div></div>
    </div>

    <div id="game-scene">
        <div id="bird-container">
            <div id="multiplier-tag">x1.00</div>
            <div id="bird">🐦‍⬛</div>
        </div>
    </div>

    <div class="controls" id="mainControls">
        <button class="btn btn-free" onclick="handleFlightAttempt(0)">БЕСПЛАТНЫЙ ПОЛЕТ (БЕЗ ЛИМИТА)</button>
        <button class="btn btn-std" onclick="handleFlightAttempt(50, 'spin')">СПИН (50 ⭐)</button>
        <button class="btn btn-super" onclick="handleFlightAttempt(150, 'super_spin')">СУПЕР СПИН (150 ⭐)</button>
        <button class="btn btn-turbo" onclick="handleFlightAttempt(300, 'turbo_spin')">ТУРБО СПИН (300 ⭐)</button>
        <button class="btn btn-energy" onclick="triggerPayment('energy')">⚡ ЭНЕРГИЯ (25 ⭐)</button>

        <button class="btn btn-soon">ЛИГА СКОРО</button>
        <button class="btn btn-soon">МАГАЗИН СКОРО</button>
        <button class="btn btn-soon">КЕЙСЫ СКОРО</button>
        <button class="btn btn-soon" onclick="openInvite()">ДРУЗЬЯ</button>
    </div>
    
    <button id="takeBtn" class="btn btn-take" onclick="takeWin()">ЗАБРАТЬ ⭐</button>

    <div class="history-list" id="historyLog">История: Ожидание полета...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const API_URL = "http://85.198.96.191:8080";
        const PROXY = "https://api.allorigins.win/get?url=";
        let userId = tg.initDataUnsafe.user?.id || 12345;
        let balance = 0, flightTotal = 0, isPlaying = false, refCount = 0;

        // --- ОПЛАТА И СЕРВЕР (ИЗ ТВОЕГО КОДА) ---
        async function callServer(endpoint, params) {
            const target = `${API_URL}/${endpoint}?${params}&t=${Date.now()}`;
            try {
                const res = await fetch(PROXY + encodeURIComponent(target));
                const data = await res.json();
                return JSON.parse(data.contents);
            } catch (e) { throw e; }
        }

        async function triggerPayment(type) {
            try {
                tg.MainButton.setText("ОЖИДАНИЕ СЧЕТА...");
                tg.MainButton.show();
                const data = await callServer('pay', `user_id=${userId}&type=${type}`);
                tg.MainButton.hide();
                if (data.link) {
                    tg.openInvoice(data.link, (status) => {
                        if (status === 'paid') {
                            tg.showAlert("✅ Успешно зачислено!");
                            sync();
                        }
                    });
                }
            } catch (e) {
                tg.showAlert("Ошибка связи с сервером.");
                tg.MainButton.hide();
            }
        }

        async function sync() {
            try {
                const data = await callServer('get_user', `user_id=${userId}`);
                balance = data.balance || 0;
                refCount = data.ref_count || 0;
                updateUI();
            } catch (e) {
                balance = parseInt(localStorage.getItem('bird_bal')) || 0;
                updateUI();
            }
        }
        // --- КОНЕЦ БЛОКА ОПЛАТЫ ---

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance;
            document.getElementById('currentWin').innerText = flightTotal;
            document.getElementById('ref-val').innerText = refCount;
            let p = Math.min((balance/1000)*100, 100);
            document.getElementById('progressBar').style.width = p + '%';
            document.getElementById('with-val').innerText = Math.floor(p);
            localStorage.setItem('bird_bal', balance);
        }

        function handleFlightAttempt(cost, type) {
            if (cost > balance && cost !== 0) {
                tg.showConfirm(`Недостаточно звезд. Купить ${cost} ⭐?`, (ok) => {
                    if(ok) triggerPayment(type);
                });
                return;
            }
            startFlight(cost);
        }

        function startFlight(cost) {
            isPlaying = true; balance -= cost; flightTotal = 0;
            document.getElementById('mainControls').style.display = 'none';
            document.getElementById('takeBtn').style.display = 'block';
            document.getElementById('multiplier-tag').style.display = 'block';
            updateUI();
            
            let multi = 1.0;
            let gameTimer = setInterval(() => {
                if (Math.random() < 0.12) { // 12% шанс падения
                    clearInterval(gameTimer);
                    endGame(false);
                } else {
                    multi += 0.05;
                    flightTotal += (cost === 0 ? 3 : Math.floor(cost * 0.1 * multi));
                    document.getElementById('currentWin').innerText = flightTotal;
                    document.getElementById('multiplier-tag').innerText = `x${multi.toFixed(2)}`;
                    
                    // Движение птицы
                    document.getElementById('bird-container').style.top = (30 + Math.random() * 40) + '%';
                    spawnEffectStar();
                }
            }, 800);
            window.activeTimer = gameTimer;
        }

        function takeWin() { 
            clearInterval(window.activeTimer); 
            balance += flightTotal; 
            endGame(true); 
        }

        function endGame(win) {
            isPlaying = false;
            document.getElementById('mainControls').style.display = 'grid';
            document.getElementById('takeBtn').style.display = 'none';
            document.getElementById('multiplier-tag').style.display = 'none';
            
            const history = document.getElementById('historyLog');
            history.innerHTML = win ? `✅ Забрал: ${flightTotal} ⭐` : `💥 Краш: 0 ⭐`;
            history.style.color = win ? "#10b981" : "#f43f5e";

            if(!win) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("ПТИЦА УПАЛА! ⭐");
            } else {
                tg.HapticFeedback.notificationOccurred('success');
            }
            
            flightTotal = 0;
            updateUI();
        }

        function spawnEffectStar() {
            const star = document.createElement('div');
            star.className = 'floating-star';
            star.innerText = '⭐';
            star.style.top = (30 + Math.random() * 40) + '%';
            document.getElementById('game-scene').appendChild(star);
            setTimeout(() => star.remove(), 1500);
        }

        function openInvite() {
            const link = `https://t.me/Luckyspin2026_bot?start=${userId}`;
            tg.showPopup({ title: 'Друзья', message: `Твоя ссылка:\n${link}`, buttons: [{text: 'КОПИРОВАТЬ'}] });
        }

        function checkWithdraw() {
            if(balance >= 1000 && refCount >= 5) {
                tg.showAlert("Заявка на вывод принята! Ожидайте сообщения от бота.");
            } else {
                tg.showAlert(`Для вывода нужно 1000 ⭐ и 5 друзей.\nУ тебя: ${balance} ⭐ и ${refCount} друзей.`);
            }
        }

        // Облака
        function initScene() {
            const scene = document.getElementById('game-scene');
            for(let i=0; i<6; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.width = (40 + Math.random()*60) + 'px';
                cloud.style.height = '15px';
                cloud.style.top = (Math.random()*200) + 'px';
                cloud.style.animationDuration = (3 + Math.random()*7) + 's';
                cloud.style.animationDelay = (Math.random()*5) + 's';
                scene.appendChild(cloud);
            }
        }

        initScene();
        sync();
    </script>
</body>
</html>
